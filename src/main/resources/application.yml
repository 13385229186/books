spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/books
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 1
      lettuce:
        pool:
          max-idle: 10
          max-active: 20
          min-idle: 5
  servlet:
    multipart:
      max-file-size: 10MB    # 单个文件最大10MB
      max-request-size: 20MB # 整个请求最大20MB


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto # 全局启用自增策略

jwt:
  secret-key: WJartUkQh5faYN4pz38uQN4mJEO0L3LjtIW2inMCxjY=  #jwt签名私钥
  token-header: Authorization
  token-prefix: Bearer
  expiration-time: 86400  # 24小时（秒）
#  expiration-time: 30  # 30秒
  refresh-expiration: 604800  # 7天（秒）
#  issuer: BooksApplication
#  audience: Books

logging:
  level:
    root: INFO
    org.springframework: WARN
    com.example: DEBUG
  file:
    name: logs/app.log
  logback:
    rolling policy:
      max-file-size: 10MB
      max-history: 7
      file-name-pattern: logs/app-%d{yyyy-MM-dd}.%i.log  # 按日期滚动
